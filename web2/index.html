<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  <title>wordlace</title>
</head>

<body>
  <div id="app">

    <main>

      <div class="top-section">
        
        <div class="quilt-wrapper">
          <div id="quilt">
          </div>
        </div>
      
        <div class="center">
          <!-- <div class="blur-overlay"></div> -->
          <div id="en-visualizer"></div>
          
         <div class="nav-bar">
          <div style="display: flex;flex-direction: row;">
          <button id="syntactic-btn" class="btn">Syntactic Tree</button>
          <button id="semantic-relationship-btn" class="btn active">Semantic relationship</button>
          <button id="predicate-btn" class="btn">Predicate</button>
          <button id="semantic-functions-btn" class="btn">Semantic functions</button>
        </div>

        <div style="display: flex;flex-direction: row;">
            <div class="slider">
            <input id="gap-size-slider" type="range" min="20" max="120" value="90" />
          </div>
          <div class="checkboxes">
           <input type="checkbox" id="show-all-hidden" name="show">
           <label for="show">Show all dependency curves</label>
          </div>
       </div> </div>

    
          <!-- TODO: show normalized words construction;
             highlight the word thats being hovered  -->
        </div>
        <div class="right">
          <div class="bookmark">
            <div class="grammar">
              <h3>indistinguishable</h3>
              <div>in·dis·tin·guish·a·ble</div>
              <div>adjective</div>
              <div>not able to be identified as different or distinct.</div>
              <div><small>"the counterfeit bills were virtually indistinguishable from the real thing"</small></div>
            </div>
            <div class="reconstruct-wrapper">
              <h3>Line</h3>
               <div id="original--line"></div>
              <h3>Reconstruction</h3>
               <div id="reconstruction"></div>
            </div>
        
          </div>
        </div>
        </div>

    </div> -->

       
    </main>
  </div>
