<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <link href="./styles.css" rel="stylesheet" />
  <title>vector plot</title>

</head>

<body>
  <div class="main-container">

    <div class="left-section">
      <div class="fulltext-scroll-container">
        <h1>So-to-speak</h1>
        <div id="full-text"></div>
      </div>

      <div class="bottom-bar">
        <div class="segmented" role="radiogroup" aria-label="SRL display mode">
          <label>
            <input type="radio" name="srl-mode" value="semantic-role" id="srl-toggle-input" checked>
            <span>semantic role</span>
          </label>
          <label>
            <input type="radio" name="srl-mode" id="srl-toggle-input-word" value="word">
            <span>word</span>
          </label>
        </div>

        <label class="srl-toggle">
          <input type="checkbox" id="color-toggle-input">
          <div>color:&nbsp;<span id="color-option">none</span></div>
        </label>
      </div>

    </div>

    <div class="right-section-container">
      <div class="right-section">
        <div id="collapse-button" class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256">
            <path
              d="M213.66,53.66,163.31,104H192a8,8,0,0,1,0,16H144a8,8,0,0,1-8-8V64a8,8,0,0,1,16,0V92.69l50.34-50.35a8,8,0,0,1,11.32,11.32ZM112,136H64a8,8,0,0,0,0,16H92.69L42.34,202.34a8,8,0,0,0,11.32,11.32L104,163.31V192a8,8,0,0,0,16,0V144A8,8,0,0,0,112,136Z">
            </path>
          </svg>
        </div>
        <section class="dep-graph-container">
          <div class="word-plot"></div>
          <div class="vector-plot"></div>
        </section>
      </div>

    </div>

    <div class="subway-section-container">
      <div class="dependency-subway-container"></div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
