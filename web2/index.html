<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <link href="./styles.css" rel="stylesheet" />
  <title>vector plot</title>

</head>

<body>
  <div class="main-container">

    <div class="left-section">
      <div class="fulltext-scroll-container">
        <h1>So-to-speak</h1>
        <div id="full-text"></div>
      </div>
    </div>

    <div class="right-section-container">

      <div class="top-bar">
        <label class="srl-toggle">
          <input type="checkbox" id="srl-toggle-input" checked>
          <span>SRL</span>
        </label>
        <label class="srl-toggle">
          <input type="checkbox" id="color-toggle-input">
          <span>Color code by semantic roles</span>
        </label>
      </div>

      <div class="right-section">
        <section class="dep-graph-container">
          <div class="word-plot"></div>
          <div class="vector-plot"></div>
        </section>
      </div>

    </div>

    <div class="subway-section-container">
      <div class="dependency-subway-container"></div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
