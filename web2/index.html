<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <link href="./styles.css" rel="stylesheet" />
  <title>vector plot</title>

</head>

<body>
  <div class="main-container">

    <div class="left-section">

      <div id="collapse-button" class="icon">
        <svg id="expand-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256">
          <path
            d="M216,48V96a8,8,0,0,1-16,0V67.31l-50.34,50.35a8,8,0,0,1-11.32-11.32L188.69,56H160a8,8,0,0,1,0-16h48A8,8,0,0,1,216,48ZM106.34,138.34,56,188.69V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16H67.31l50.35-50.34a8,8,0,0,0-11.32-11.32Z">
          </path>
        </svg>

        <svg id="collapse-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"
          class="hidden">
          <path
            d="M213.66,53.66,163.31,104H192a8,8,0,0,1,0,16H144a8,8,0,0,1-8-8V64a8,8,0,0,1,16,0V92.69l50.34-50.35a8,8,0,0,1,11.32,11.32ZM112,136H64a8,8,0,0,0,0,16H92.69L42.34,202.34a8,8,0,0,0,11.32,11.32L104,163.31V192a8,8,0,0,0,16,0V144A8,8,0,0,0,112,136Z">
          </path>
        </svg>
      </div>

      <div class="fulltext-scroll-container">
        <h1>So-to-speak</h1>
        <div id="full-text"></div>
      </div>

    </div>

    <div class="right-section-container">
      <div class="bottom-bar">
        <label class="play-button">
          <input type="checkbox" id="play-toggle-input">
          <span class="play-icon"></span>
        </label>

        <div class="segmented" role="radiogroup" aria-label="SRL display mode">
          <label>
            <input type="radio" name="srl-mode" value="semantic-role" id="srl-toggle-input" checked>
            <span>semantic role</span>
          </label>
          <label>
            <input type="radio" name="srl-mode" id="srl-toggle-input-word" value="word">
            <span>word</span>
          </label>
        </div>

        <label class="srl-toggle">
          <input type="checkbox" id="color-toggle-input">
          <div>color:&nbsp;<span id="color-option">none</span></div>
        </label>


        <label class="srl-toggle">
          <input type="checkbox" id="sound-toggle-input" checked>
          <svg class="sound-icon" id="sound-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 256 256">
            <path
              d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z">
            </path>
          </svg>

          <svg class="sound-icon hidden" id="muted-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="#000000" viewBox="0 0 256 256">
            <path
              d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm101.66-61.3a8,8,0,0,1-11.32,11.32L216,139.31l-18.34,18.35a8,8,0,0,1-11.32-11.32L204.69,128l-18.35-18.34a8,8,0,0,1,11.32-11.32L216,116.69l18.34-18.35a8,8,0,0,1,11.32,11.32L227.31,128Z">
            </path>
          </svg>
        </label>

        <div class="sound-modes" role="radiogroup" aria-label="sound mode">
          <label>
            <input type="radio" name="sound-mode" value="0" id="sound-mode-1-btn" checked>
            <span>1</span>
          </label>
          <label>
            <input type="radio" name="sound-mode" value="1" id="sound-mode-2-btn">
            <span>2</span>
          </label>
        </div>

      </div>
      <div class="right-section">
        <section class="dep-graph-container">
          <div class="word-plot"></div>
          <div class="vector-plot"></div>
        </section>
      </div>

    </div>

    <div class="subway-section-container">
      <div class="notes">Hover on a node in the diagram to see its semantic dependencies.</div>
      <div class="dependency-subway-container">

      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
